<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Hamburger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
       <div class="header-content">
         <div class="logo">
            <img src="images/foodie hamburger logo.svg" alt="logo">
         </div>
          <div class="hamburger-menu-container">
            <div class="hamburger-menu">
              <span class="hamburger-icon">&#9776;</span>
            </div>
          </div>
        <nav>
            <span class="close-icon">&times;</span>
            <a href="#top-picks">Top Picks</a>
            <a href="#Whopper">Whopper</a>
            <a href="#stunner-menu">Stunner Menu</a>
            <a href="#new-foodie-collection">New Foodie Collection</a>
            <a href="#deal-of-the-day">Deal of the Day</a>
        </nav>
       </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="img-container">
                <img src="images/hero-img.png" alt="hero-img">
            </div>
            <p>Well, You can’t resist anymore!</p>
        </section>


         <section id="top-picks" class="section">
            <h2>Top Picks</h2>
            <div class="img-container">
                <img src="images/img2.png" alt="img2">
            </div>
        </section>


         <section id="Whopper" class="section">
            <h2>Whopper</h2>
            <div class="img-container">
                <img src="images/img3.png" alt="img3">
            </div>
        </section>



         <section id="stunner-menu" class="section">
            <h2>Stunner Menu</h2>
            <div class="img-container">
                <img src="images/img4.png" alt="hero-img">
            </div>
        </section>



         <section id="new-foodie-collection" class="section">
            <h2>New Foodie Collection</h2>
            <div class="img-container">
                <img src="images/img5.png" alt="hero-img">
            </div>
        </section>


         <section id="deal-of-the-day" class="section">
            <h2>Deal of the Day</h2>
            <div class="img-container">
                <img src="images/img6.png" alt="hero-img">
            </div>
        </section>
     
    </main>

    <footer>
         <h3 class="go-to-top"><a href="#">Go To Top</a></h3>
        <p class="footer-text">Made with  ❤️ by Anurag Singh                   </p>
    </footer>
</body>
</html>
